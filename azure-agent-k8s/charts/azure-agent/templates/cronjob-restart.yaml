{{- if .Values.nightlyRestart.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.nightlyRestart.name | default (printf "%s-nightly-restart" (include "azure-agent.fullname" .)) }}
  labels:
    {{- include "azure-agent.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.nightlyRestart.schedule | quote }}
  concurrencyPolicy: {{ .Values.nightlyRestart.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.nightlyRestart.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.nightlyRestart.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "azure-agent.name" . }}-restart
            cronjob: nightly-restart
        spec:
          serviceAccountName: {{ .Values.nightlyRestart.serviceAccountName | default (include "azure-agent.serviceAccountName" .) }}
          restartPolicy: OnFailure
          containers:
            - name: kubectl-restart
              image: "{{ .Values.nightlyRestart.image.repository }}:{{ .Values.nightlyRestart.image.tag }}"
              imagePullPolicy: {{ .Values.nightlyRestart.image.pullPolicy }}
              command:
                - sh
                - -c
                - "kubectl rollout restart statefulset/{{ include "azure-agent.fullname" . }} -n {{ .Release.Namespace }}"
{{- end }}

